<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>词流 Lexicon Flow</title>
  <style>
    :root { --ink: #22352f; --muted: #6c7a73; --primary: #527b69; --line: #e4eae5; --bg: #f5f7f3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink); background: var(--bg); }
    main { width: min(680px, 100%); }
    .eyebrow { font-size: 12px; letter-spacing: .16em; color: var(--primary); font-weight: 700; }
    h1 { font-size: clamp(30px, 6vw, 46px); margin: 10px 0 8px; letter-spacing: .02em; }
    .sub { color: var(--muted); font-size: 15px; line-height: 1.7; margin: 0 0 28px; }
    .cards { display: grid; gap: 14px; }
    @media (min-width: 620px) { .cards { grid-template-columns: 1fr 1fr; } }
    a.card { display: block; padding: 22px; border: 1px solid var(--line); border-radius: 18px;
      background: #fff; color: inherit; text-decoration: none; box-shadow: 0 6px 20px rgba(38,62,51,.05);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
    a.card:hover { transform: translateY(-3px); border-color: var(--primary); box-shadow: 0 12px 28px rgba(38,62,51,.1); }
    a.card .badge { font-size: 11px; color: var(--primary); font-weight: 700; }
    a.card strong { display: block; font-size: 20px; margin: 8px 0 6px; }
    a.card small { color: var(--muted); font-size: 13px; line-height: 1.6; }
    footer { margin-top: 26px; color: var(--muted); font-size: 12px; line-height: 1.8; }
    footer a { color: var(--primary); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">LEXICON FLOW · v0.1.0</p>
    <h1>词流</h1>
    <p class="sub">完整四六级词库 · 输入线语境复现 · 产出线四级阶梯。选择版本开始离线学习，数据仅保存在你的浏览器中。</p>
    <div class="cards">
      <a class="card" href="functional/standalone.html">
        <span class="badge">功能更新版</span>
        <strong>清新绿主题</strong>
        <small>完整功能与数据，默认清新绿配色，移动端与 PC 响应式。</small>
      </a>
      <a class="card" href="ios/standalone.html">
        <span class="badge">iOS 风格副本</span>
        <strong>iOS 蓝主题</strong>
        <small>同数据同逻辑，仅 UI 采用 iOS 设计语言。</small>
      </a>
    </div>
    <footer>
      纯前端应用，无需安装；推荐使用现代浏览器。<br>
      项目源码与说明见 <a href="https://github.com/lisiyangl1/lexicon-flow">GitHub 仓库</a> · 采用 MIT License。
    </footer>
  </main>
</body>
</html>
