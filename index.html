<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f3">
  <meta http-equiv="refresh" content="0; url=functional/index.html">
  <title>词流 Lexicon Flow</title>
  <script>location.replace("functional/index.html");</script>
  <style>
    :root { --ink: #22352f; --muted: #6c7a73; --primary: #527b69; --line: #e4eae5; --bg: #f5f7f3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink); background: var(--bg); }
    main { width: min(480px, 100%); text-align: center; }
    h1 { font-size: 34px; margin: 12px 0 8px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.7; margin: 0 0 14px; }
    a { color: var(--primary); font-weight: 600; }
    small { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>词流</h1>
    <p>正在进入应用（默认清新绿主题，进入后可随时在右上角或「我的」页切换外观）…</p>
    <p><a href="functional/index.html">如果没有自动跳转，点这里进入</a></p>
    <p><small>偏好 iOS 风格？<a href="ios/index.html">iOS 蓝主题版本</a></small></p>
  </main>
</body>
</html>
