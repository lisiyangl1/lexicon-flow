<!DOCTYPE html>
<html lang="zh-CN" data-theme="ios">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#f5f7f3">
  <meta name="description" content="英语主动与被动词汇记忆系统：完整四六级词库、间隔复习、转化训练、错题重练、同义词跳转与本地统计。">
  <title>词流 · 主动词汇记忆系统</title>
  <link href="favicon.svg" rel="icon" type="image/svg+xml">
  <link href="styles.css" id="theme-green" rel="stylesheet">
  <link href="theme-ios.css" id="theme-ios" rel="stylesheet">
  <script>
    // 主题引导：按 html[data-theme] 决定启用哪套样式表（默认清新绿）
    (function () {
      var theme = document.documentElement.dataset.theme || "green";
      var green = document.getElementById("theme-green");
      var ios = document.getElementById("theme-ios");
      if (green && ios) { ios.disabled = theme !== "ios"; green.disabled = theme === "ios"; }
    })();
  </script>
</head>
<body>
  <div class="app-shell" id="app">
    <header class="app-header">
      <div class="brand-row">
        <button aria-label="返回首页" class="brand" data-route="home" type="button">
          <span aria-hidden="true" class="brand-mark">
            <svg viewBox="0 0 32 32"><path d="M7 8.5h8a4 4 0 0 1 4 4V25a4 4 0 0 0-4-4H7V8.5Z"/><path d="M25 8.5h-2a4 4 0 0 0-4 4V25a4 4 0 0 1 4-4h2V8.5Z"/></svg>
          </span>
          <span>词流</span>
        </button>
        <div class="brand-row-actions">
          <button aria-label="切换主题" class="icon-button theme-toggle" data-action="toggle-theme" id="theme-toggle" title="换肤" type="button"></button>
          <button aria-label="页面操作" class="icon-button header-action hidden" id="header-action" type="button"></button>
        </div>
      </div>
      <div class="page-heading">
        <p class="eyebrow" id="page-eyebrow">DAILY RHYTHM</p>
        <h1 id="page-title">今日学习</h1>
        <p class="page-subtitle" id="page-subtitle">让认识的词，真正成为你的表达。</p>
      </div>
    </header>

    <main class="app-main" id="main-content" tabindex="-1"></main>

    <nav aria-label="主导航" class="bottom-nav">
      <button aria-current="page" class="nav-item active" data-route="home" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg>
        <span>首页</span>
      </button>
      <button aria-current="false" class="nav-item" data-route="library" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14Z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20v-4"/></svg>
        <span>词库</span>
      </button>
      <button aria-current="false" class="nav-item" data-route="review" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7h-9a4 4 0 0 0-4 4v1"/><path d="m17 4 3 3-3 3M4 17h9a4 4 0 0 0 4-4v-1"/><path d="m7 20-3-3 3-3"/></svg>
        <span>复习</span>
      </button>
      <button aria-current="false" class="nav-item" data-route="stats" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>统计</span>
      </button>
      <button aria-current="false" class="nav-item" data-route="profile" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>我的</span>
      </button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div aria-live="polite" class="toast" id="toast" role="status"></div>
  <div aria-live="polite" class="sr-only" id="live-region"></div>

  <script defer src="words.js"></script>
  <script defer src="data.js"></script>
  <script defer src="srs.js"></script>
  <script defer src="store.js"></script>
  <script defer src="ai.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
